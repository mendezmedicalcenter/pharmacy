<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendez Pharmacy — Daily Log</title>
  <meta name="apple-mobile-web-app-title" content="Mendez Pharmacy">
  <meta name="application-name" content="Mendez Pharmacy">
  <meta name="description" content="Mendez Medical Center — Pharmacy Daily Log">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a2a6e">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root{ --navy:#163a6b; --blue:#2563b0; --panel:#e8f0fb; --ink:#1f2937; --sub:#5b6b80; --line:#dbe6f5; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Segoe UI',Calibri,system-ui,Arial,sans-serif; background:#eef3fb; color:var(--ink); }
    .wrap{ max-width:1400px; margin:0 auto; padding:18px 22px 60px; }
    .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .topbar img{ height:40px; width:40px; object-fit:contain; border-radius:9px; background:#fff; padding:4px; box-shadow:0 3px 10px rgba(10,42,110,.12); }
    .topbar b{ color:var(--navy); font-size:18px; letter-spacing:-.2px; }
    .topbar span{ color:var(--sub); font-size:13px; }

    .btn{ border:none; border-radius:10px; font-size:13px; font-weight:700; letter-spacing:.2px; padding:9px 16px; min-height:34px; cursor:pointer; transition:background .15s,opacity .15s; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1; box-sizing:border-box; }
    .btn svg{ width:16px; height:16px; flex:0 0 auto; }
    .btn.primary{ background:var(--blue); color:#fff; }
    .btn.primary:hover{ background:#1e56a0; }
    .btn.ghost{ background:transparent; color:var(--navy); padding:9px 16px; font-size:13px; font-weight:700; letter-spacing:.2px; }
    .btn.ghost:hover{ color:var(--blue); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    .pdl{ display:flex; flex-direction:column; gap:16px; }
    .pdl.pdl-fs{ position:fixed; inset:0; width:auto; max-width:none; z-index:400; background:#eef3fb; overflow:auto; padding:14px 0 env(safe-area-inset-bottom); margin:0; }
    .pdl-banner{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:linear-gradient(120deg,#0a2a52 0%,#103a6e 100%); border-top:5px solid #f5a821; border-radius:14px; box-shadow:0 8px 22px rgba(10,42,110,.22); padding:18px 22px; color:#fff; }
    .pdl-banner h1{ margin:0; font-size:26px; }
    .pdl-banner p{ margin:3px 0 0; color:#b9cbe6; font-size:14px; }
    .pdl-banner-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .pdl-tech{ display:inline-flex; align-items:center; gap:8px; background:#fff; border-radius:10px; padding:8px 12px; color:#0a2a52; font-weight:700; font-size:13px; }
    .pdl-tech select{ border:none; background:transparent; font-weight:700; color:#0a2a52; font-size:14px; outline:none; }
    .pdl-date{ position:relative; display:inline-flex; align-items:center; background:#fff; color:#0a2a52; border-radius:10px; padding:9px 14px; font-weight:700; font-size:14px; cursor:pointer; }
    .pdl-date input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
    .pdl-date input::-webkit-calendar-picker-indicator{ position:absolute; inset:0; width:100%; height:100%; margin:0; cursor:pointer; }
    .pdl-clock{ text-align:right; line-height:1.1; }
    .pdl-clock b{ font-size:24px; }
    .pdl-clock > span{ display:flex; align-items:center; gap:6px; justify-content:flex-end; color:#7fdca9; font-size:12px; margin-top:7px; }
    .pdl-clock i{ width:8px; height:8px; border-radius:50%; background:#3ecf8e; animation:pdlblink 1.5s ease-in-out infinite; }
    @keyframes pdlblink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
    .pdl-today{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:11.5px; font-weight:700; border-radius:8px; padding:4px 9px; cursor:pointer; margin-top:3px; }
    .pdl-today:hover{ background:rgba(255,255,255,.24); }

    .pdl-stats{ display:flex; gap:16px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; align-items:stretch; transition:background .3s,border-color .3s; }
    #pdl-stats2{ margin-bottom:16px; }
    .pdl-stats.lvl-good{ background:#a9dcbc; border:2px solid #146b3d; }
    .pdl-stats.lvl-moderate{ background:#f6cd8c; border:2px solid #a96b12; }
    .pdl-stats.lvl-high{ background:#f0b3aa; border:2px solid #922316; }
    .pdl-cap{ color:#2563b0; font-size:12px; font-weight:800; letter-spacing:1.5px; }
    .pdl-waiting{ flex:0 0 220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-right:1px solid rgba(0,0,0,.08); }
    .pdl-waiting b{ font-size:64px; color:#0a2a52; line-height:1; }
    .lvl-good .pdl-waiting b{ color:#1b7a45; }
    .lvl-moderate .pdl-waiting b{ color:#b9741a; }
    .lvl-high .pdl-waiting b{ color:#b23528; }
    .pdl-status-box{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
    .pdl-status{ width:100%; text-align:center; padding:26px; border-radius:12px; font-size:30px; font-weight:800; color:#fff; letter-spacing:1px; }
    .pdl-status.good{ background:linear-gradient(135deg,#2fae6d 0%,#1f8a53 100%); border:2.5px solid #146b3d; box-shadow:0 8px 22px rgba(31,138,83,.3); }
    .pdl-status.clear{ background:#eef2f7; border:2.5px solid #cdd8e6; color:#33507a; box-shadow:none; }
    .pdl-status.moderate{ background:linear-gradient(135deg,#f0a83a 0%,#e08a1e 100%); border:2.5px solid #a96b12; box-shadow:0 8px 22px rgba(224,138,30,.32); }
    .pdl-status.high{ background:linear-gradient(135deg,#e0574a 0%,#c0392b 100%); border:2.5px solid #922316; box-shadow:0 8px 22px rgba(192,57,43,.32); }
    /* TV / full-screen: hide the blue banner + tabs, slim the thermometer so the table has room */
    .pdl-fs .pv-tabs{ display:none; }
    .pdl-fs #pdl-stats2{ padding:9px 18px; margin-bottom:12px; }
    .pdl-fs #pdl-stats2 .pdl-waiting{ flex:0 0 180px; gap:1px; }
    .pdl-fs #pdl-stats2 .pdl-waiting b{ font-size:38px; }
    .pdl-fs #pdl-stats2 .pdl-status-box{ gap:5px; }
    .pdl-fs #pdl-stats2 .pdl-status{ padding:11px 16px; font-size:26px; }
    .pdl-fs #pdl-stats2 .pdl-cap{ font-size:11px; letter-spacing:1px; }

    .pdl-table-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; border-top:3px solid #1e56a0; }
    .pdl-table-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
    .pdl-table-head h3{ margin:0; color:var(--navy); font-size:18px; }
    .pdl-avg{ background:transparent; color:var(--sub); font-size:12.5px; font-weight:700; padding:6px 0; }
    .pdl-actions{ margin-left:auto; display:flex; gap:8px; }
    .pdl-table-wrap{ overflow-x:auto; }
    .pdl-table{ width:100%; border-collapse:collapse; font-size:13px; }
    .pdl-table th{ text-align:center; color:var(--sub); font-size:11px; font-weight:800; letter-spacing:.5px; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    .pdl-table td{ padding:8px 8px; border-bottom:1px solid #f0f4f9; color:var(--ink); vertical-align:middle; text-align:center; }
    .pdl-empty{ text-align:center; color:var(--sub); font-style:italic; padding:26px 0 !important; }
    .pdl-name{ font-weight:700; color:var(--navy); white-space:nowrap; }
    .pdl-dim{ color:#b3c3da; }
    .pdl-center{ text-align:center; }
    .pdl-in{ width:100%; min-width:56px; border:1px solid var(--line); border-radius:9px; padding:6px 8px; font-size:13px; outline:none; background:#fff; }
    .pdl-in:focus{ border-color:var(--blue); }
    .pdl-in.num{ max-width:72px; }
    .pdl-sel{ appearance:none; -webkit-appearance:none; -moz-appearance:none; width:auto; max-width:100%; border:1px solid #e2e9f3; border-radius:9px; padding:6px 30px 6px 14px; font-size:12.5px; font-weight:600; color:#123a70; cursor:pointer; white-space:nowrap; text-align:center; text-align-last:center; background-color:#f5f8fd; background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%20viewBox='0%200%2010%206'%3E%3Cpath%20d='M1%201l4%204%204-4'%20fill='none'%20stroke='%23516b90'%20stroke-width='1.6'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 10px center; transition:border-color .15s, background-color .15s, box-shadow .15s; }
    .pdl-sel::-ms-expand{ display:none; }
    .pdl-sel option{ text-align:center; }
    .pdl-sel:hover{ background-color:#eef3fb; border-color:#cdd9ec; }
    .pdl-sel:focus{ outline:none; border-color:var(--blue); background-color:#fff; box-shadow:0 0 0 3px rgba(37,99,176,.13); }
    .xsel{ position:relative; display:inline-flex; align-items:center; gap:7px; min-width:150px; max-width:100%; box-sizing:border-box; border:1px solid #e2e9f3; border-radius:9px; padding:6px 12px; font-size:12.5px; font-weight:600; color:#123a70; cursor:pointer; background:#f5f8fd; white-space:nowrap; user-select:none; transition:border-color .15s, background .15s, box-shadow .15s; }
    .xsel:hover{ background:#eef3fb; border-color:#cdd9ec; }
    .xsel.open{ border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(37,99,176,.13); }
    .xsel-val{ flex:1 1 auto; text-align:center; overflow:hidden; text-overflow:ellipsis; }
    .xsel-cv{ width:10px; height:6px; flex:0 0 auto; }
    .xsel-menu{ position:fixed; z-index:1000; background:#fff; border:1px solid #dbe6f5; border-radius:11px; box-shadow:0 14px 34px rgba(16,40,80,.18); padding:5px; max-height:300px; overflow-y:auto; }
    .xsel-menu[hidden]{ display:none; }
    .xsel-opt{ padding:8px 16px; border-radius:7px; font-size:12.5px; font-weight:600; color:#123a70; text-align:center; white-space:nowrap; cursor:pointer; }
    .xsel-opt:hover{ background:#eef3fb; }
    .xsel-opt.sel{ background:var(--blue); color:#fff; }
    .xsel-opt.ph{ color:#8aa0bd; }
    .pay{ display:inline-flex; align-items:center; justify-content:center; min-height:30px; padding:0 13px; border-radius:9px; font-size:12px; font-weight:800; line-height:1; border:none; }
    .pay-nocopay{ background:#eef2f7; color:#8fa0b5; }
    .pay-btn{ cursor:pointer; position:relative; }
    .pay-notposted{ background:#fbe0c0; color:#b06612; }
    .pay-posted{ background:#d9f1e2; color:#1c7a3f; }
    .pay-hover{ display:none; }
    .pay-btn:hover .pay-normal{ display:none; }
    .pay-btn:hover .pay-hover{ display:inline; }
    .pay-btn.pay-notposted:hover{ background:#2e9e5b; color:#fff; }
    .pay-btn.pay-posted:hover{ background:#fbe0c0; color:#b06612; }
    .pdl-pill{ display:inline-flex; align-items:center; justify-content:center; min-height:30px; padding:0 13px; border-radius:9px; font-size:12px; font-weight:800; line-height:1; white-space:nowrap; }
    .pdl-pill.p-Checkingout{ background:#dbe8fb; color:#1d4f9e; }
    .pdl-pill.p-Waiting{ background:#f6c445; color:#6b4a06; }
    .pdl-pill.p-InProgress{ background:#2f7be0; color:#fff; }
    .pdl-pill.p-Ready{ background:#7a3fc0; color:#fff; }
    .pdl-pill.p-Completed{ background:#2e9e5b; color:#fff; }
    .pdl-pill.p-NoShowLeft{ background:#d1503f; color:#fff; }
    .pdl-noteicon{ background:none; border:none; cursor:pointer; color:#b3c3da; padding:4px; border-radius:6px; display:inline-flex; }
    .pdl-noteicon:hover{ background:var(--panel); }
    .pdl-noteicon.has{ color:#e0a11e; }
    .pdl-actcell{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; }
    .pdl-act-left{ justify-self:start; display:inline-flex; align-items:center; gap:6px; }
    .pdl-act-mid{ justify-self:center; display:inline-flex; align-items:center; }
    .pdl-act-right{ justify-self:end; display:inline-flex; align-items:center; gap:6px; }
    .pdl-mcell{ white-space:nowrap; }
    .pdl-dol{ color:#1c7a3f; font-weight:800; font-size:12px; margin-right:2px; }
    .pdl-money{ width:56px; border:1px solid var(--line); border-radius:9px; padding:6px 6px; font-size:13px; outline:none; text-align:center; }
    .pdl-money:focus{ border-color:var(--blue); }
    .pdl-backslot{ flex:0 0 26px; display:inline-flex; justify-content:center; }
    .pdl-actslot{ flex:0 0 118px; display:inline-flex; justify-content:center; }
    .pdl-act{ display:inline-flex; align-items:center; justify-content:center; min-height:30px; width:auto; white-space:nowrap; border:none; border-radius:9px; color:#fff; font-size:12px; font-weight:800; line-height:1; padding:0 14px; cursor:pointer; background:#103a6e; }
    .pdl-act:hover:not(:disabled){ filter:brightness(1.08); }
    .pdl-act:disabled{ opacity:.4; cursor:not-allowed; }
    .pdl-back,.pdl-noshow,.pdl-trash{ background:none; border:none; cursor:pointer; padding:5px; border-radius:6px; display:inline-flex; align-items:center; }
    .pdl-back{ color:#7c96bb; }
    .pdl-back:hover{ color:var(--navy); background:var(--panel); }
    .pdl-noshow{ color:#c99; }
    .pdl-noshow:hover{ color:#c0392b; background:#fdecea; }
    .pdl-trash{ color:#c7cfdb; }
    .pdl-trash:hover{ color:#c0392b; background:#fdecea; }
    .pdl-totals{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-top:14px; margin-top:6px; border-top:1px solid var(--line); font-size:13px; color:var(--sub); }
    .pdl-totals b{ color:var(--navy); }
    .pdl-sep{ width:1px; height:16px; background:var(--line); }
    .pdl-amber b{ color:#c77c1c; }
    .pdl-green b{ color:#1e7d34; }

    .pdl-modal-bg{ position:fixed; inset:0; background:rgba(10,25,50,.5); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px; }
    .pdl-modal{ width:100%; max-width:560px; background:#fff; border-radius:18px; padding:24px 26px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
    .pdl-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .pdl-modal-head h2{ margin:0; color:var(--navy); font-size:22px; }
    .pdl-x{ background:none; border:none; color:#c0392b; cursor:pointer; font-size:16px; padding:4px 8px; border-radius:6px; }
    .pdl-x:hover{ background:#fdecea; }
    .pdl-field{ display:block; margin-bottom:16px; }
    .pdl-field > span{ display:block; font-size:14px; font-weight:700; color:var(--navy); margin-bottom:7px; }
    .pdl-field em{ color:var(--sub); font-weight:500; font-style:normal; }
    .pdl-field input,.pdl-field textarea{ width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font-size:16px; outline:none; font-family:inherit; }
    .pdl-field input:focus,.pdl-field textarea:focus{ border-color:var(--blue); }
    .pdl-field textarea{ min-height:90px; resize:vertical; }
    .pdl-modal-note{ background:#fff8ec; border-left:4px solid #e6a23c; border-radius:8px; padding:12px 14px; font-size:14px; color:#6b5836; margin-bottom:18px; }
    .pdl-modal-foot{ display:flex; justify-content:flex-end; gap:10px; }
    /* view switching (Dashboard / Daily Log) */
    .pv{ display:none; }
    body.view-dashboard .pv-dashboard{ display:block; }
    body.view-daily .pv-daily{ display:block; }
    .pv-tabs{ display:flex; gap:8px; margin:4px 0 2px; }
    body.embed .pv-tabs{ display:none; }
    body.embed .wrap{ max-width:none; }
    .pv-tab{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 18px; font-weight:700; color:var(--sub); cursor:pointer; font-size:14px; }
    .pv-tab.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
    .pdo{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-top:16px; border-top:3px solid #1e56a0; }
    .pdo-head{ font-weight:800; color:var(--navy); font-size:18px; margin-bottom:14px; }
    .pdo-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
    .pdo-card{ background:#fbfcff; border:1px solid var(--line); border-top:4px solid #2f6bd8; border-radius:14px; padding:16px 16px; min-width:0; transition:transform .15s, box-shadow .15s; }
    .pdo-card:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(20,49,92,.08); }
    .pdo-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; background:rgba(47,107,216,.1); color:#2f6bd8; }
    .pdo-label{ font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--sub); margin-bottom:4px; text-transform:uppercase; }
    .pdo-num{ font-size:32px; font-weight:800; color:var(--navy); line-height:1.05; margin-bottom:4px; letter-spacing:-.5px; }
    .pdo-sub{ font-size:12px; color:var(--sub); }
    .pdo-card.t-amber{ border-top-color:#e6a23c; } .pdo-card.t-amber .pdo-icon{ background:rgba(255,153,0,.12); color:#b35900; }
    .pdo-card.t-teal{ border-top-color:#06b6d4; } .pdo-card.t-teal .pdo-icon{ background:rgba(6,182,212,.12); color:#0e7490; }
    .pdo-card.t-purple{ border-top-color:#7a3fc0; } .pdo-card.t-purple .pdo-icon{ background:rgba(124,58,237,.12); color:#7a3fc0; }
    .pdo-card.t-green{ border-top-color:#2e9e5b; } .pdo-card.t-green .pdo-icon{ background:rgba(14,159,110,.12); color:#047857; }
    .pdo-card.t-blue{ border-top-color:#2f6bd8; } .pdo-card.t-blue .pdo-icon{ background:rgba(37,99,235,.12); color:#2f6bd8; }
    .pdo-card.t-indigo{ border-top-color:#5b4bd8; } .pdo-card.t-indigo .pdo-icon{ background:rgba(91,75,216,.12); color:#5b4bd8; }
    @media print{ .pv-tabs,.pdl-actions,.pdl-tech,.pdl-date,.pdl-banner,.pdl-stats{ display:none !important; } body.view-dashboard .pv-daily, body.view-daily .pv-dashboard{ display:block !important; } }
    .pdl-dob{ font-size:11px; color:#6b7a90; font-weight:600; margin-top:2px; }
    .pdl-fdtag{ display:inline-block; font-size:10px; font-weight:800; color:#9a6a12; background:#fff3d6; border:1px solid #f0c56a; border-radius:6px; padding:1px 5px; vertical-align:middle; }
  </style>

<body>
  <div class="wrap" id="wrap"></div>

  <script>
  (function(){
    'use strict';
    var TECHS = ['Bruno Bandeira','Carola Roca','Lauriangel Leon','Nicoll Oviedo','Yasmin Garcia','Other'];
    var ADVANCE = {
      'Checking out':{label:'Start',to:'In Progress',needTech:true},
      'Waiting':{label:'Start',to:'In Progress',needTech:true},
      'In Progress':{label:'Mark Ready',to:'Ready'},
      'Ready':{label:'Complete',to:'Completed'},
      'Completed':null,'No Show / Left':null
    };
    var BACK = {'Checking out':null,'Waiting':null,'In Progress':'Waiting','Ready':'In Progress','Completed':'Ready','No Show / Left':null};
    function scls(s){ return s.replace(/[^a-zA-Z]/g,''); }
    function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function storeKeyFor(k){ return 'mmc-pharm-dailylog-'+k; }
    function loadDay(k){ try{ var a=JSON.parse(localStorage.getItem(storeKeyFor(k))||'[]'); a.forEach(function(p){ if(p.status==='Coming') p.status='Checking out'; }); return a; }catch(e){ return []; } }
    function fmtTime(ts){ return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
    function money(n){ return '$'+(n||0).toFixed(2); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function inQueue(s){ return s==='Waiting'||s==='In Progress'; }

    var S = {
      selDate: todayKey(),
      patients: loadDay(todayKey()),
      tech: '',
      now: Date.now(),
      modal: false,
      full: false
    };
    function isToday(){ return S.selDate===todayKey(); }
    function persist(){ try{ localStorage.setItem(storeKeyFor(S.selDate), JSON.stringify(S.patients)); }catch(e){} }
    function byId(id){ for(var i=0;i<S.patients.length;i++){ if(S.patients[i].id===id) return S.patients[i]; } return null; }

      var current={}; list.forEach(function(h){ current[h.id]=true; }); // fdIds currently flagged Rx
      var existing={}; S.patients.forEach(function(p){ if(p.fdId) existing[p.fdId]=true; });

      list.forEach(function(h){

          employee:'', provider:h.provider||'', rx:0, debit:0, cash:0, payment:'No Copay', del:false });
        added=true;

      var before=S.patients.length;
      S.patients=S.patients.filter(function(p){ return !(p.fdId && !current[p.fdId] && p.status==='Checking out'); });

      document.body.classList.add('view-'+t);
      var tabs=document.querySelectorAll('.pv-tab');
      for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('on', tabs[i].getAttribute('data-view')===t); }
    }

    // Full-screen = CSS overlay (reliable inside iframes) + tell the host (portal/Lovable) to hide its sidebar and expand the iframe.
    function toggleFull(){
      S.full=!S.full;
      render();
      try{ window.parent.postMessage({type:'queue-fullscreen', app:'pharmacy', full:S.full}, '*'); }catch(e){}
    }
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&S.full){ S.full=false; render(); try{ window.parent.postMessage({type:'queue-fullscreen', app:'pharmacy', full:false}, '*'); }catch(e2){} } });

    // ---- event delegation ----
    document.addEventListener('click',function(e){
      var t=e.target;
      var xopt=t.closest&&t.closest('.xsel-opt');
      if(xopt){ var xbox=xopt.closest('.xsel'); if(xbox){ var xp=byId(xbox.getAttribute('data-id')); if(xp){ xp[xbox.getAttribute('data-field')]=xopt.getAttribute('data-v'); persist(); render(); } } return; }
      var xb=t.closest&&t.closest('.xsel');
      if(xb){ if(xb.querySelector('.xsel-menu').hidden) openXsel(xb); else closeAllXsel(); return; }
      closeAllXsel();
    });
    window.addEventListener('scroll', function(e){ if(e.target&&e.target.closest&&e.target.closest('.xsel-menu')) return; closeAllXsel(); }, true);
    window.addEventListener('resize', closeAllXsel);
    var wrap=document.getElementById('wrap');
    wrap.addEventListener('click',function(e){
      var el=e.target.closest('[data-action]'); if(!el) return;
      var a=el.getAttribute('data-action'), id=el.getAttribute('data-id'), p=id?byId(id):null;
      if(a==='add'){ S.modal=true; render(); }
      else if(a==='closex'){ S.modal=false; render(); }
      else if(a==='modalbg'){ if(e.target===el){ S.modal=false; render(); } }
      else if(a==='modaladd'){ doModalAdd(); }
      else if(a==='advance'&&p){ advance(p); }
      else if(a==='back'&&p){ back(p); }
      else if(a==='noshow'&&p){ noShow(p); }
      else if(a==='trash'&&p){ S.patients=S.patients.filter(function(x){ return x.id!==id; }); persist(); render(); }
      else if(a==='note'&&p){ var n=window.prompt('Note for '+p.name, p.notes); if(n!==null){ update(id,{notes:n}); render(); } }
      else if(a==='paytoggle'&&p){ update(id,{payment:p.payment==='Posted'?'Not Posted':'Posted'}); var cell=document.querySelector('.pdl-pay-cell[data-id="'+id+'"]'); if(cell) cell.innerHTML=paymentCellHTML(p); refreshDerived(); }
      else if(a==='refresh'){ S.now=Date.now(); render(); }
      else if(a==='print'){ window.print(); }
      else if(a==='full'){ toggleFull(); }
      else if(a==='view'){ applyView(el.getAttribute('data-view')); }
      else if(a==='today'){ changeDate(todayKey()); }
    });
    wrap.addEventListener('input',function(e){
      var el=e.target, field=el.getAttribute&&el.getAttribute('data-field'), id=el.getAttribute&&el.getAttribute('data-id');
      if(!field||!id) return; var p=byId(id); if(!p) return;
      if(field==='provider'){ p.provider=el.value; persist(); }
      else if(field==='rx'){ p.rx=+el.value; persist(); refreshDerived(); }
      else if(field==='debit'||field==='cash'){ var mv=el.value.replace(/[^0-9.]/g,''); if(mv!==el.value) el.value=mv; setMoney(p,field,+mv||0); var cell=document.querySelector('.pdl-pay-cell[data-id="'+id+'"]'); if(cell) cell.innerHTML=paymentCellHTML(p); refreshDerived(); }
    });
    wrap.addEventListener('change',function(e){
      var el=e.target, role=el.getAttribute&&el.getAttribute('data-role'), field=el.getAttribute&&el.getAttribute('data-field'), id=el.getAttribute&&el.getAttribute('data-id');
      if(role==='tech'){ S.tech=el.value; render(); }
      else if(role==='date'){ changeDate(el.value); }
      else if(field==='provider'&&id){ var pp=byId(id); if(pp){ pp.provider=el.value; persist(); } }
      else if(field==='del'&&id){ update(id,{del:el.checked}); }
    });

    // live clock — targeted, so it never clobbers an input you're typing in
    setInterval(function(){
      S.now=Date.now();
      var ct=document.getElementById('pdl-clock-time'); if(ct) ct.textContent=fmtTime(S.now);
      var cs=document.getElementById('pdl-clock-sub'); if(cs) cs.innerHTML='<i></i> Live · updated '+fmtTime(S.now);
      if(isToday()){ var cells=document.querySelectorAll('.pdl-wait'); for(var i=0;i<cells.length;i++){ var p=byId(cells[i].getAttribute('data-id')); if(p) cells[i].textContent=waitText(p); } }
      refreshDerived();
    },1000);

    // view mode: embedded in the portal (?embed=1) hides the in-app tabs and takes
    // the view (dashboard / daily) from the URL hash; standalone defaults to dashboard.
    var _embed=/[?&]embed=1/.test(location.search);
    var _tv=/[?&]tv=1/.test(location.search); // TV kiosk: open straight into full-screen Daily Log
    if(_embed) document.body.classList.add('embed');
    function _viewFromHash(){ return location.hash.replace(/^#/,'')==='daily'?'daily':'dashboard'; }
    if(_tv) S.full=true;
    document.body.classList.add('view-daily'); // single Queue view (Dashboard tab removed)
    render();
    initHandoffs(); // live-read patients the Front Desk flagged "Rx"
  })();
  </script>
</body>
</html>
